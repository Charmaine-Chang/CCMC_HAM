{% extends "base.html" %}
{% block title %}{{ t('register_title') }} – {{ get_setting('church_name', '漢美頓懷恩堂') }}{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-lg-5">
                    <div class="text-center mb-4">
                        <h4 class="mb-1">{{ t('register_as_member') }}</h4>
                        <p class="text-muted small mb-0">{{ t('register_intro') }}</p>
                    </div>
                    <form method="POST">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">{{ t('username') }} <span class="text-danger">*</span></label>
                                <input type="text" name="username" class="form-control" value="{{ form_data.get('username', '') }}" required>
                            </div>
                            <div class="col-12"></div>
                            <div class="col-md-6">
                                <label class="form-label">{{ t('first_name') }}</label>
                                <input type="text" name="first_name" class="form-control" value="{{ form_data.get('first_name', '') }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{{ t('last_name') }}</label>
                                <input type="text" name="last_name" class="form-control" value="{{ form_data.get('last_name', '') }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{{ t('email') }} <span class="text-danger">*</span></label>
                                <input type="email" name="email" class="form-control" value="{{ form_data.get('email', '') }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{{ t('phone') }}</label>
                                <input type="tel" name="phone" class="form-control" value="{{ form_data.get('phone', '') }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{{ t('password') }} <span class="text-danger">*</span></label>
                                <input type="password" name="password" class="form-control" required minlength="8">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{{ t('password_confirm') }} <span class="text-danger">*</span></label>
                                <input type="password" name="password_confirm" class="form-control" required minlength="8">
                            </div>
                        </div>
                        <button class="btn btn-forest w-100 btn-lg rounded-pill fw-bold mt-4">{{ t('register') }}</button>
                    </form>
                    <p class="text-center text-muted small mt-3 mb-0">{{ t('already_have_account') }}<a href="{{ url_for('auth.login') }}">{{ t('login') }}</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
