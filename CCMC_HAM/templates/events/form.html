{% extends "base.html" %}
{% block title %}{{ t('edit') if event else t('new_event') }} – {{ get_setting('church_name', '漢美頓懷恩堂') }}{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 860px;">
    <h3 class="section-title mb-4">{{ t('edit') if event else t('new_event') }}</h3>
    <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-lg-5">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">{{ t('title') }} <span class="text-danger">*</span></label>
                    <input type="text" name="title" class="form-control" value="{{ event.title if event else '' }}" required>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">{{ t('start_time') }} <span class="text-danger">*</span></label>
                        <input type="datetime-local" name="start_time" class="form-control" required value="{{ event.start_time.strftime('%Y-%m-%dT%H:%M') if event else '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('end_time') }}</label>
                        <input type="datetime-local" name="end_time" class="form-control" value="{{ event.end_time.strftime('%Y-%m-%dT%H:%M') if event and event.end_time else '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('category') }}</label>
                        <select name="category" class="form-select">
                            {% for value, label in categories %}
                            <option value="{{ value }}" {{ 'selected' if event and event.category == value }}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('group') }}</label>
                        <select name="group_id" class="form-select">
                            <option value="">{{ t('no_group') }}</option>
                            {% for g in groups %}
                            <option value="{{ g.group_id }}" {{ 'selected' if event and event.group_id == g.group_id }}>{{ get_i18n_text(g, 'group_name') }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">{{ t('location') }}</label>
                        <input type="text" name="location" class="form-control" value="{{ event.location if event else '' }}">
                    </div>
                    <div class="col-12">
                        <label class="form-label">{{ t('description') }}</label>
                        <textarea name="description" class="form-control" rows="5">{{ event.description if event else '' }}</textarea>
                    </div>
                </div>
                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" name="is_published" id="is_published" {{ 'checked' if not event or event.is_published }}>
                    <label class="form-check-label" for="is_published">{{ t('is_published') }}</label>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-forest rounded-pill px-4">{{ t('save') }}</button>
                    <a href="{{ url_for('events.index') }}" class="btn btn-outline-secondary rounded-pill px-4">{{ t('cancel') }}</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
