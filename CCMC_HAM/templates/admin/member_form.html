{% extends "base.html" %}
{% block title %}{{ t('add_member_title') }} – {{ get_setting('church_name', '漢美頓懷恩堂') }}{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 680px;">
    <h3 class="section-title mb-4"><i class="bi bi-person-plus me-2 text-forest"></i>{{ t('add_member_title') }}</h3>
    <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-lg-5">
            <form method="POST">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">{{ t('username') }} <span class="text-danger">*</span></label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('role') }}</label>
                        <select name="role_id" class="form-select">
                            {% for rid, rname in role_names.items() %}
                            <option value="{{ rid }}">{{ rname }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6"><label class="form-label">{{ t('first_name') }}</label><input type="text" name="first_name" class="form-control"></div>
                    <div class="col-md-6"><label class="form-label">{{ t('last_name') }}</label><input type="text" name="last_name" class="form-control"></div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('email') }} <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="col-md-6"><label class="form-label">{{ t('phone') }}</label><input type="tel" name="phone" class="form-control"></div>
                    <div class="col-md-6">
                        <label class="form-label">{{ t('initial_password') }} <span class="text-danger">*</span></label>
                        <input type="password" name="password" class="form-control" required minlength="8">
                        <div class="form-text">{{ t('at_least_8_chars') }}</div>
                    </div>
                </div>
                <button class="btn btn-forest rounded-pill px-4">{{ t('create_member') }}</button>
                <a href="{{ url_for('admin.members') }}" class="btn btn-outline-secondary rounded-pill px-4">{{ t('cancel') }}</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
