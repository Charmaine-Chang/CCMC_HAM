{% extends "base.html" %}
{% block title %}{{ t('announcement_form_title') }} – {{ get_setting('church_name', '漢美頓懷恩堂') }}{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 760px;">
    <h3 class="section-title mb-4">{{ t('announcement_form_title') }}</h3>
    <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-lg-5">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">{{ t('title') }} <span class="text-danger">*</span></label>
                    <input type="text" name="title" class="form-control" value="{{ announcement.title if announcement else '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ t('group') }} ({{ t('optional') }})</label>
                    <select name="group_id" class="form-select">
                        <option value="">{{ t('no_group') }}</option>
                        {% for g in groups %}
                        <option value="{{ g.group_id }}" {{ 'selected' if announcement and announcement.group_id == g.group_id }}>{{ get_i18n_text(g, 'group_name') }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ t('content') }}</label>
                    <textarea name="content" class="form-control" rows="6">{{ announcement.content if announcement else '' }}</textarea>
                </div>
                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" name="is_published" id="is_published" {{ 'checked' if not announcement or announcement.is_published }}>
                    <label class="form-check-label" for="is_published">{{ t('is_published') }}</label>
                </div>
                <button class="btn btn-forest rounded-pill px-4">{{ t('save') }}</button>
                <a href="{{ url_for('announcements.index') }}" class="btn btn-outline-secondary rounded-pill px-4">{{ t('cancel') }}</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
