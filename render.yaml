# Render Blueprint (https://render.com/docs/blueprint-spec)
# 1. Push this repository to GitHub.
# 2. In Render: New -> Blueprint -> connect this repo.
# 3. Only DB_PASSWORD needs to be filled in (set it in the service's Environment tab
#    or when prompted by the Blueprint). All other values are already provided below.
services:
  - type: web
    name: ccmc-ham
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: DB_USER
        value: "46bvyhzGfnadm6Q.root"
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        value: "gateway01.ap-southeast-1.prod.aws.tidbcloud.com"
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: "ccmc_ham"
      - key: DB_SSL
        value: "1"
      - key: DB_SSL_CA
        value: "/etc/ssl/certs/tidbcloud-cacert.pem"